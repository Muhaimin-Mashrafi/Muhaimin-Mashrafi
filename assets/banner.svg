<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Abdullah Al Muhaimin - AI / Machine Learning Enthusiast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#16213A"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7AA2F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7AA2F7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7AA2F7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#C9D1D9" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="type">
      <rect x="290" y="128" height="30" width="0">
        <animate attributeName="width" values="0;410;410" keyTimes="0;0.35;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="220" rx="10" fill="url(#bg)"/>
  <rect width="900" height="220" rx="10" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="219" rx="10" fill="none" stroke="#7AA2F7" stroke-opacity="0.35"/>

  <!-- slow scan line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#scan)">
    <animate attributeName="y" values="0;218;0" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- rotating rings + pulsing core -->
  <g transform="translate(150 110)" fill="none" stroke="#7AA2F7">
    <circle r="70" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle r="52" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="60 20 12 20">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle r="32" stroke-opacity="0.35" stroke-width="1"/>
    <circle r="9" fill="#7AA2F7" stroke="none">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" stroke-opacity="0.5" stroke-width="1">
      <animate attributeName="r" values="12;20;12" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- faint neural network (decorative) -->
  <g opacity="0.42" stroke="#7AA2F7" stroke-width="0.8" fill="none"><line x1="560" y1="40" x2="650" y2="30"/><line x1="560" y1="40" x2="650" y2="80"/><line x1="560" y1="40" x2="650" y2="175"/><line x1="560" y1="40" x2="650" y2="205"/><line x1="560" y1="95" x2="650" y2="30"/><line x1="560" y1="95" x2="650" y2="80"/><line x1="560" y1="95" x2="650" y2="130"/><line x1="560" y1="95" x2="650" y2="175"/><line x1="560" y1="95" x2="650" y2="205"/><line x1="560" y1="150" x2="650" y2="30"/><line x1="560" y1="150" x2="650" y2="80"/><line x1="560" y1="150" x2="650" y2="130"/><line x1="560" y1="150" x2="650" y2="205"/><line x1="560" y1="190" x2="650" y2="30"/><line x1="560" y1="190" x2="650" y2="205"/><line x1="650" y1="30" x2="740" y2="100"/><line x1="650" y1="30" x2="740" y2="200"/><line x1="650" y1="80" x2="740" y2="45"/><line x1="650" y1="80" x2="740" y2="100"/><line x1="650" y1="80" x2="740" y2="155"/><line x1="650" y1="130" x2="740" y2="45"/><line x1="650" y1="130" x2="740" y2="200"/><line x1="650" y1="175" x2="740" y2="45"/><line x1="650" y1="175" x2="740" y2="100"/><line x1="650" y1="175" x2="740" y2="155"/><line x1="650" y1="175" x2="740" y2="200"/><line x1="650" y1="205" x2="740" y2="100"/><line x1="650" y1="205" x2="740" y2="155"/><line x1="740" y1="45" x2="830" y2="60"/><line x1="740" y1="45" x2="830" y2="120"/><line x1="740" y1="100" x2="830" y2="120"/><line x1="740" y1="155" x2="830" y2="60"/><line x1="740" y1="200" x2="830" y2="60"/><line x1="740" y1="200" x2="830" y2="180"/></g>
  <g opacity="0.6" fill="#7AA2F7"><circle cx="560" cy="40" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="-0s" repeatCount="indefinite"/></circle><circle cx="560" cy="95" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="5s" begin="-1s" repeatCount="indefinite"/></circle><circle cx="560" cy="150" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="-2s" repeatCount="indefinite"/></circle><circle cx="560" cy="190" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="7s" begin="-3s" repeatCount="indefinite"/></circle><circle cx="650" cy="30" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="8s" begin="-4s" repeatCount="indefinite"/></circle><circle cx="650" cy="80" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="-5s" repeatCount="indefinite"/></circle><circle cx="650" cy="130" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="5s" begin="-6s" repeatCount="indefinite"/></circle><circle cx="650" cy="175" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="-0s" repeatCount="indefinite"/></circle><circle cx="650" cy="205" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="7s" begin="-1s" repeatCount="indefinite"/></circle><circle cx="740" cy="45" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="8s" begin="-2s" repeatCount="indefinite"/></circle><circle cx="740" cy="100" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="-3s" repeatCount="indefinite"/></circle><circle cx="740" cy="155" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="5s" begin="-4s" repeatCount="indefinite"/></circle><circle cx="740" cy="200" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="-5s" repeatCount="indefinite"/></circle><circle cx="830" cy="60" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="7s" begin="-6s" repeatCount="indefinite"/></circle><circle cx="830" cy="120" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="8s" begin="-0s" repeatCount="indefinite"/></circle><circle cx="830" cy="180" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="-1s" repeatCount="indefinite"/></circle></g>

  <!-- text -->
  <text x="290" y="92" fill="#E6EDF3" font-family="'Courier New', monospace" font-size="34" font-weight="700" letter-spacing="3">ABDULLAH AL MUHAIMIN</text>
  <rect x="290" y="104" width="64" height="2" fill="#7AA2F7"/>

  <g clip-path="url(#type)">
    <text x="290" y="150" fill="#C9D1D9" font-family="'Courier New', monospace" font-size="18" letter-spacing="1">&gt; AI / MACHINE LEARNING ENTHUSIAST</text>
  </g>
  <rect x="290" y="133" width="9" height="20" fill="#7AA2F7">
    <animate attributeName="x" values="290;696;696" keyTimes="0;0.35;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <text x="290" y="188" fill="#8B949E" font-family="'Courier New', monospace" font-size="13" letter-spacing="2">building intelligent systems...</text>
</svg>
